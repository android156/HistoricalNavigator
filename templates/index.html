{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <!-- Карта -->
    <div class="col-md-8">
        <div class="card h-100">
            <div class="card-body">
                <div id="map" style="width: 100%; height: 100%; min-height: 400px;"></div>
            </div>
        </div>
    </div>

    <!-- Форма поиска -->
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header">
                <h5 class="card-title mb-0">Поиск исторических данных</h5>
            </div>
            <div class="card-body">
                <form id="searchForm">
                    <div class="mb-3">
                        <label for="locationInput" class="form-label">Место:</label>
                        <input type="text" class="form-control" id="locationInput" placeholder="Введите место или координаты">
                    </div>

                    <div class="mb-3">
                        <label for="timePeriod" class="form-label">Временной период:</label>
                        <input type="text" class="form-control" id="timePeriod" placeholder="Например: 1274-1311, 1255, 23.06.1984">
                        <div class="form-text text-muted">
                            Поддерживаемые форматы: год (1255), период (1274-1311), дата (DD.MM.YYYY)
                        </div>
                    </div>

                    <button type="submit" id="searchButton" class="btn btn-primary w-100">Найти</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Историческая информация -->
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Историческая информация</h5>
            </div>
            <div class="card-body">
                <div id="historicalInfo">
                    <p class="text-muted">Выберите точку на карте и временной период для получения информации</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
